      <article class="sf-noscript">
        <div class="sf-noscript__wrap">
          <header>
            <p class="sf-noscript__eyebrow">Studifree</p>
            <h1>Studifree – Learn Differently</h1>
            <p class="sf-noscript__lead">
              Studifree is a modern study companion built to help students learn, revise, and test
              themselves using simple study tools and supported AI-powered features.
            </p>
            <p class="sf-noscript__notice">
              JavaScript is required to use the interactive app. This page summarises what Studifree
              is, what it can do, and how the bring-your-own-key AI model works.
            </p>
            <a class="sf-noscript__cta" href="/home">Open Studifree</a>
          </header>

          <section aria-labelledby="ns-what">
            <h2 id="ns-what">What is Studifree?</h2>
            <p>
              Studifree is a modern study companion built to help students learn, revise, and test
              themselves using simple study tools and supported AI-powered features. It brings
              notes, flashcards, quizzes and explanations into one focused learning space.
            </p>
          </section>

          <section aria-labelledby="ns-can">
            <h2 id="ns-can">What can you do with Studifree?</h2>

            <h3>AI-Powered Learning</h3>
            <p>
              Students can use supported AI features to understand topics, generate learning
              material, and receive explanations.
            </p>

            <h3>Flashcards</h3>
            <p>Create and study flashcards to help with active recall and revision.</p>

            <h3>Quizzes</h3>
            <p>
              Generate and practice quizzes to test understanding and identify areas that need more
              revision.
            </p>

            <h3>Study Materials</h3>
            <p>
              Turn learning material into useful study resources where supported, including notes,
              questions, and flashcards.
            </p>

            <h3>Learn at Your Own Pace</h3>
            <p>
              Studifree is designed to make complicated studying feel more approachable with simple
              instructions and beginner-friendly workflows.
            </p>
          </section>

          <section aria-labelledby="ns-ai">
            <h2 id="ns-ai">Use Your Own AI Key</h2>
            <p>
              Studifree supports a bring-your-own-key approach for supported AI features. Instead of
              forcing every learner into a single subscription, users can connect their own supported
              AI API key and use AI according to the availability, limits, and pricing of their own
              provider account.
            </p>
            <p>
              Your AI usage and available quota depend on the AI provider and your personal account.
              Studifree does not promise unlimited AI usage, and AI usage is not necessarily free
              simply because you supply your own key.
            </p>
            <p>
              Studifree provides clear setup instructions inside the application for users who are
              new to API keys.
            </p>
          </section>

          <section aria-labelledby="ns-how">
            <h2 id="ns-how">How Studifree Works</h2>
            <ol>
              <li>
                <h3>1. Choose What You Want to Learn</h3>
                <p>Start with your topic, material, or study goal.</p>
              </li>
              <li>
                <h3>2. Create Study Resources</h3>
                <p>
                  Use available tools to create notes, flashcards, quizzes, and other learning
                  resources.
                </p>
              </li>
              <li>
                <h3>3. Add AI When You Need It</h3>
                <p>Configure a supported AI API key to unlock AI-powered features.</p>
              </li>
              <li>
                <h3>4. Learn and Practice</h3>
                <p>Study through active recall, quizzes, explanations, and revision.</p>
              </li>
              <li>
                <h3>5. Keep Improving</h3>
                <p>Return to your materials and continue learning at your own pace.</p>
              </li>
            </ol>
          </section>

          <section aria-labelledby="ns-why">
            <h2 id="ns-why">Why Studifree Was Created</h2>
            <p>
              Studifree was created around a simple idea: studying should not feel unnecessarily
              complicated.
            </p>
            <p>
              Many students jump between multiple apps for notes, flashcards, quizzes, explanations,
              and AI assistance. Studifree aims to bring useful learning tools into one focused
              experience while keeping the interface simple enough for people who are not technical.
            </p>
            <p>
              The goal is not to make studying look complicated or futuristic for the sake of it. The
              goal is to make useful technology easier to understand and actually helpful when
              someone is trying to learn.
            </p>
          </section>

          <section aria-labelledby="ns-founder">
            <h2 id="ns-founder">Founded by Syed Zain-ul-Abideen</h2>
            <p>
              Studifree was founded by Syed Zain-ul-Abideen with the goal of making modern study
              tools and AI-assisted learning easier to access and simpler to use.
            </p>
          </section>

          <section aria-labelledby="ns-privacy">
            <h2 id="ns-privacy">Built with Privacy in Mind</h2>
            <p>
              Studifree is designed around a local-first experience where applicable. Study
              preferences and locally stored data can remain on the user's device depending on the
              feature being used.
            </p>
            <p>
              Some features may require external services, such as AI providers or optional services
              chosen by the user. Those services may process information according to their own
              policies.
            </p>
            <p>
              Users should review the app's Privacy Policy and the policies of connected services for
              complete details.
            </p>
          </section>

          <section aria-labelledby="ns-faq">
            <h2 id="ns-faq">Frequently Asked Questions</h2>

            <details>
              <summary>Is Studifree free?</summary>
              <p>
                The core application is designed to provide free access to its study tools. Some AI
                features depend on your own AI provider and API usage, so provider quotas, limits,
                and pricing may apply.
              </p>
            </details>

            <details>
              <summary>Do I need an account?</summary>
              <p>
                The core local study experience is designed to work without a mandatory account.
                Some features, such as connecting an AI provider, require their own setup. Any
                account needed for a third-party service is separate from Studifree.
              </p>
            </details>

            <details>
              <summary>What is an AI API key?</summary>
              <p>
                An AI API key is a private code from an AI provider that lets an application send
                requests to that provider on your behalf. Studifree uses the key you provide to
                connect to the supported provider you choose.
              </p>
            </details>

            <details>
              <summary>Why should I use my own AI key?</summary>
              <p>
                It lets you connect your own provider account so usage is governed by your own
                account, limits, and configuration. It also means AI access is not tied to a single
                Studifree subscription.
              </p>
            </details>

            <details>
              <summary>Are API keys free?</summary>
              <p>
                Availability, free tiers, quotas, and pricing depend entirely on the provider. Some
                providers offer limited free usage; others charge for requests. Review your
                provider's pricing before using AI features.
              </p>
            </details>

            <details>
              <summary>Is my data stored locally?</summary>
              <p>
                Studifree is designed around a local-first experience where applicable. Study
                preferences and locally stored study data can remain on your device. When you use AI
                features, the content you send is processed by your chosen AI provider according to
                that provider's policies. Optional services may also process data as described in the
                Privacy Policy.
              </p>
            </details>

            <details>
              <summary>Can beginners use Studifree?</summary>
              <p>
                Yes. Studifree provides clear instructions and simple workflows so you do not need
                technical knowledge to use most features. AI setup includes guidance for creating and
                connecting a supported API key.
              </p>
            </details>

            <details>
              <summary>What can I study with Studifree?</summary>
              <p>
                Studifree can support many subjects and learning goals, depending on the tools and
                materials available. You can work with your own notes, material, or study goals.
              </p>
            </details>
          </section>

          <footer>
            <p>Studifree — Learn differently.</p>
            <p>Studifree was founded by Syed Zain-ul-Abideen.</p>
